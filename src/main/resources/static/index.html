<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件后缀统计工具</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-light: #eef2ff;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px; /* 稍微调窄一点，因为列减少了 */
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            padding: 24px 30px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(to right, #ffffff, #f9fafb);
        }

        .header h1 { font-size: 20px; font-weight: 700; color: var(--text-main); }
        .header p { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }

        .control-panel {
            padding: 20px 30px;
            display: flex;
            gap: 10px;
            background-color: #fff;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--primary-color); }

        button#searchBtn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button#searchBtn:hover { opacity: 0.9; }
        button#searchBtn:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .results-area { padding: 0 30px 30px 30px; }

        /* 表格样式优化 */
        .table-container {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            background-color: #f9fafb;
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f9fafb; }

        /* 后缀徽章 */
        .ext-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            background-color: var(--primary-light);
            color: var(--primary-color);
            border-radius: 99px;
            font-family: monospace;
            font-weight: 600;
            font-size: 13px;
        }

        /* 数量列右对齐 */
        .col-count { text-align: right; width: 100px; }
        .col-bar { width: 40%; }

        /* 简单的进度条背景 */
        .bar-bg {
            background-color: #f3f4f6;
            height: 6px;
            border-radius: 3px;
            width: 100%;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 3px;
        }

        .status-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .error-msg {
            color: #dc2626;
            background-color: #fef2f2;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📂 文件类型分布统计</h1>
        <p>输入目录路径，查看各后缀文件数量占比</p>
    </div>

    <div class="control-panel">
        <input type="text" id="pathInput" placeholder="输入文件夹路径 (例如: D:/Data)" value="D:/Workspace">
        <button id="searchBtn">查询</button>
    </div>

    <div class="results-area">
        <div id="statusContainer" class="status-msg">等待查询...</div>
        <div id="errorMsg" class="error-msg"></div>

        <div class="table-container" id="tableContainer">
            <table>
                <thead>
                <tr>
                    <th width="25%">后缀名</th>
                    <th width="35%" class="col-bar">分布占比</th>
                    <th width="20%" class="col-count">数量</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                <!-- JS 填充 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const searchBtn = document.getElementById('searchBtn');
    const pathInput = document.getElementById('pathInput');
    const statusContainer = document.getElementById('statusContainer');
    const tableContainer = document.getElementById('tableContainer');
    const tableBody = document.getElementById('tableBody');
    const errorMsg = document.getElementById('errorMsg');

    // 模拟后端返回的 Map<String, Integer> JSON 数据
    function mockBackendResponse() {
        return new Promise(resolve => {
            setTimeout(() => {
                // 注意：Key 有时可能不带点，有时带点，代码需兼容
                resolve({
                    "jpg": 145,
                    ".png": 89,
                    "java": 320,
                    ".class": 315,
                    "xml": 45,
                    ".log": 12,
                    "md": 8
                });
            }, 600);
        });
    }

    function renderTable(dataMap) {
        tableBody.innerHTML = '';

        // 1. 转换 Map 为数组并计算总数
        let totalFiles = 0;
        const items = Object.entries(dataMap).map(([key, count]) => {
            totalFiles += count;
            return { ext: key, count: count };
        });

        if (totalFiles === 0) {
            statusContainer.style.display = 'block';
            statusContainer.textContent = '该目录下没有文件或返回数据为空';
            tableContainer.style.display = 'none';
            return;
        }

        // 2. 排序：按数量降序
        items.sort((a, b) => b.count - a.count);

        // 3. 渲染行
        items.forEach(item => {
            const row = document.createElement('tr');

            // 处理后缀显示：确保有 '.' 前缀
            let displayExt = item.ext;
            if (!displayExt.startsWith('.')) {
                displayExt = '.' + displayExt;
            }

            // 计算百分比用于进度条宽度
            const percentage = ((item.count / totalFiles) * 100).toFixed(1);

            row.innerHTML = `
                <td><span class="ext-badge">${displayExt}</span></td>
                <td class="col-bar">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: ${percentage}%"></div>
                        </div>
                        <span style="font-size: 12px; color: #6b7280; width: 35px;">${percentage}%</span>
                    </div>
                </td>
                <td class="col-count" style="font-weight: 600;">${item.count}</td>
            `;
            tableBody.appendChild(row);
        });

        tableContainer.style.display = 'block';
        statusContainer.style.display = 'none';
    }

    async function handleSearch() {
        const path = pathInput.value.trim();
        if (!path) {
            errorMsg.textContent = "请输入路径";
            errorMsg.style.display = 'block';
            return;
        }

        // UI 状态更新
        errorMsg.style.display = 'none';
        tableContainer.style.display = 'none';
        statusContainer.style.display = 'block';
        statusContainer.textContent = '正在分析数据...';
        searchBtn.disabled = true;

        try {
            // ==========================================
            // 真实对接代码 (取消注释并使用)
            // ==========================================

            const response = await fetch('/find?path=' + encodeURIComponent(path));
            if (!response.ok) throw new Error('请求失败');
            const data = await response.json();


            // ==========================================
            // 模拟演示代码
            // ==========================================
            // const data = await mockBackendResponse();

            renderTable(data);

        } catch (err) {
            console.error(err);
            statusContainer.style.display = 'none';
            errorMsg.textContent = "获取数据失败: " + err.message;
            errorMsg.style.display = 'block';
        } finally {
            searchBtn.disabled = false;
        }
    }

    searchBtn.addEventListener('click', handleSearch);
    pathInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSearch();
    });
</script>

</body>
</html>
